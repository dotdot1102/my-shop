<!doctype html>
<html>
<head><meta charset="utf-8"><title>Footer — preview</title>
<style>
body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--ink)}
footer{background:var(--surface-footer);border-top:1px solid var(--line);overflow:hidden;container-type:inline-size}
.wm{margin:0;padding:var(--space-30) var(--space-20) 0;box-sizing:border-box;font-family:var(--font-display);font-weight:400;font-size:calc((100cqw - 160px) / 6.2);line-height:1.15;white-space:nowrap;text-align:center;color:var(--brand-deep)}
.low{max-width:var(--content-max);margin:0 auto;padding:var(--space-18) var(--space-6)}
.row{display:flex;flex-wrap:wrap;gap:48px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line);padding-top:var(--space-8)}
.lab{margin:0 0 var(--space-3);font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--ink-muted)}
.tbd{margin:0;font-size:14px;color:var(--ink-muted);border:1px dashed var(--line-input);padding:6px 12px}
.note{margin:0;font-size:13px;color:var(--ink-muted)}
</style></head>
<body>
<div id="root">
<footer>
<p class="wm" lang="en">Green Issue</p>
<div class="low"><div class="row"><div><p class="lab">SNS</p><p class="tbd">채널 · 링크 — 추후 결정</p></div><p class="note">상품 가격은 시세를 참고한 예시입니다.</p></div></div>
</footer>
</div>
<script></script>
</body>
</html>
