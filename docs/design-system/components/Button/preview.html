<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>
body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--ink);word-break:keep-all}

.k{height:var(--button-height);width:var(--form-max);max-width:100%;background:var(--brand);color:var(--on-brand);border:1px solid var(--brand)}
.b:hover,.hov{background:var(--brand-hover);color:var(--on-brand-hover);border-color:var(--brand-hover)}
.cap{font-size:12px;color:var(--ink-muted);width:100%;margin:0}
