<!doctype html>
<html>
<head><meta charset="utf-8"><title>MenuLink — preview</title>
<style>
body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--ink)}
nav{height:var(--header-height);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 var(--space-6);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-size:19px;font-weight:600;letter-spacing:.02em}
.menu{display:flex;align-items:center;gap:36px}
.m{font-size:15px;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:8px;transition:text-decoration-color .18s ease}
.m:hover,.m.hov{text-decoration-color:var(--brand)}
.m.cur{color:var(--brand)}
.s{display:inline-flex;align-items:center;height:44px;padding:0 20px;border:1px solid var(--ink);border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--ink);text-decoration:none}
</style></head>
<body>
<div id="root">
<nav aria-label="예시 메뉴">
<a class="logo" href="#"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="12" stroke="currentColor" stroke-width="1.4"/><path d="M13 21V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M13 13c0-3.6 2.6-6 6-6 0 3.6-2.6 6-6 6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span lang="en">Green Issue</span></a>
<div class="menu">
<a class="m hov" href="#">루틴 만들기</a>
<a class="m cur" href="#" aria-current="page">정기배송 신청</a>
<a class="s" href="#">가입 · 로그인</a>
</div>
</nav>
</div>
<script></script>
</body>
</html>
