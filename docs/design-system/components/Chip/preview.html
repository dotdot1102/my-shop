<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chip — preview</title>
<style>
body{margin:0;background:var(--surface-white);font-family:var(--font-sans);color:var(--ink)}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);padding:var(--space-6);max-width:520px}
button{min-height:52px;padding:0 var(--space-4);border-radius:var(--radius-sm);font:inherit;font-size:15px;text-align:left;cursor:pointer;background:var(--surface-white);color:var(--ink);border:1px solid var(--line-input);transition:background-color .2s ease,color .2s ease,border-color .2s ease}
button:hover{border-color:var(--ink)}
button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:500}
</style></head>
<body>
<div id="root" class="g" role="group" aria-label="생활 패턴 예시">
<button type="button" aria-pressed="true">생활 패턴 1</button>
<button type="button" aria-pressed="false">생활 패턴 2</button>
<button type="button" aria-pressed="false">생활 패턴 3</button>
<button type="button" aria-pressed="false">생활 패턴 4</button>
</div>
<script>
document.querySelectorAll('#root button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('#root button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')})})});
</script>
</body>
</html>
